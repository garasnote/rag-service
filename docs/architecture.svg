<text x="46" y="45" font-size="20" fill="#f1f5f9" text-anchor="start" font-weight="700" letter-spacing="0.5">rag-service</text><text x="46" y="66" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" letter-spacing="0">retrieval over the job corpus · 2,569 documents · a citation on every answer</text><g><rect x="40" y="96" width="680" height="380" rx="18" fill="rgba(15,23,42,0.5)" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="9,6"/><path d="M 58 97 H 702 a17,17 0 0 1 17,17 v16 h-680 v-16 a17,17 0 0 1 17,-17 z" fill="#7c3aed" fill-opacity="0.13"/><text x="60" y="120" font-size="10.5" fill="#cbd5e1" text-anchor="start" font-weight="700" letter-spacing="1.3">INGESTION + INDEX BUILD</text><text x="702" y="120" font-size="9" fill="#64748b" text-anchor="end" font-weight="400" letter-spacing="0">offline · rebuilt per corpus</text></g><g><rect x="70" y="158" width="280" height="86" rx="11" fill="#0a1020"/><rect x="70" y="158" width="280" height="86" rx="11" fill="rgba(30, 41, 59, 0.75)" stroke="#94a3b8" stroke-width="1.6"/><rect x="70" y="158" width="280" height="86" rx="11" fill="url(#shade)"/><g transform="translate(96,185)" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-5" rx="8" ry="3"/><path d="M-8,-5 V6 a8,3 0 0 0 16,0 V-5"/><path d="M-8,1 a8,3 0 0 0 16,0"/></g><text x="117" y="189" font-size="12" fill="#cbd5e1" text-anchor="start" font-weight="700" letter-spacing="0">Sources</text><text x="117" y="207" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">job_tracker/data.json</text><text x="117" y="220" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">hiresignal warehouse.db</text><text x="117" y="233" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">fixtures/corpus.json</text></g><g><rect x="380" y="158" width="280" height="86" rx="11" fill="#0a1020"/><rect x="380" y="158" width="280" height="86" rx="11" fill="rgba(76, 29, 149, 0.5)" stroke="#a78bfa" stroke-width="1.6"/><rect x="380" y="158" width="280" height="86" rx="11" fill="url(#shade)"/><g transform="translate(406,185)" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-6,-8 h8 l4,4 v12 h-12 z"/><path d="M2,-8 v4 h4"/></g><text x="427" y="189" font-size="12" fill="#ddd6fe" text-anchor="start" font-weight="700" letter-spacing="0">Corpus loader</text><text x="427" y="207" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">dedupe by url, one doc per posting</text><text x="427" y="220" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">title · url · text</text><rect x="601.0" y="167" width="49.0" height="16" rx="8" fill="rgba(2,6,23,0.85)" stroke="#a78bfa" stroke-width="1"/><text x="625.5" y="178.5" font-size="8" fill="#a78bfa" text-anchor="middle" font-weight="400" letter-spacing="0">2,569</text></g><g><rect x="70" y="300" width="280" height="86" rx="11" fill="#0a1020"/><rect x="70" y="300" width="280" height="86" rx="11" fill="rgba(76, 29, 149, 0.5)" stroke="#a78bfa" stroke-width="1.6"/><rect x="70" y="300" width="280" height="86" rx="11" fill="url(#shade)"/><g transform="translate(96,327)" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="-1" cy="-2" r="6"/><path d="M3,2 L8,7"/></g><text x="117" y="331" font-size="12" fill="#ddd6fe" text-anchor="start" font-weight="700" letter-spacing="0">BM25 index</text><text x="117" y="349" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">stdlib, k1=1.5 b=0.75</text><text x="117" y="362" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">Spanish Snowball stemming</text></g><g><rect x="380" y="300" width="280" height="86" rx="11" fill="#0a1020"/><rect x="380" y="300" width="280" height="86" rx="11" fill="rgba(76, 29, 149, 0.5)" stroke="#a78bfa" stroke-width="1.6"/><rect x="380" y="300" width="280" height="86" rx="11" fill="url(#shade)"/><g transform="translate(406,327)" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,4 h5 l3,-8 h3 l3,8 h2"/></g><text x="427" y="331" font-size="12" fill="#ddd6fe" text-anchor="start" font-weight="700" letter-spacing="0">Dense index</text><text x="427" y="349" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">Hashing-512 · MiniLM ONNX</text><text x="427" y="362" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">cosine over vectors</text></g><g><rect x="70" y="400" width="280" height="62" rx="11" fill="#0a1020"/><rect x="70" y="400" width="280" height="62" rx="11" fill="rgba(120, 53, 15, 0.4)" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="6,4"/><rect x="70" y="400" width="280" height="62" rx="11" fill="url(#shade)"/><g transform="translate(96,427)" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-6,-8 h8 l4,4 v12 h-12 z"/><path d="M2,-8 v4 h4"/></g><text x="117" y="431" font-size="12" fill="#fde68a" text-anchor="start" font-weight="700" letter-spacing="0">Chunking</text><text x="117" y="449" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">600/80 windows · HNSW on top</text></g><g><rect x="740" y="96" width="660" height="380" rx="18" fill="rgba(15,23,42,0.5)" stroke="#0891b2" stroke-width="1.2" stroke-dasharray="9,6"/><path d="M 758 97 H 1382 a17,17 0 0 1 17,17 v16 h-660 v-16 a17,17 0 0 1 17,-17 z" fill="#0891b2" fill-opacity="0.13"/><text x="760" y="120" font-size="10.5" fill="#cbd5e1" text-anchor="start" font-weight="700" letter-spacing="1.3">SERVING</text><text x="1382" y="120" font-size="9" fill="#64748b" text-anchor="end" font-weight="400" letter-spacing="0">per request · milliseconds on 2.6k docs</text></g><g><rect x="770" y="158" width="260" height="86" rx="11" fill="#0a1020"/><rect x="770" y="158" width="260" height="86" rx="11" fill="rgba(8, 51, 68, 0.7)" stroke="#22d3ee" stroke-width="1.6"/><rect x="770" y="158" width="260" height="86" rx="11" fill="url(#shade)"/><g transform="translate(796,185)" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="-7" y="-6" width="14" height="12" rx="2"/><path d="M-3,-6 v-2 M3,-6 v-2 M-3,6 v2 M3,6 v2"/></g><text x="817" y="189" font-size="12" fill="#a5f3fc" text-anchor="start" font-weight="700" letter-spacing="0">Entry points</text><text x="817" y="207" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">CLI · FastAPI /ask · Streamlit</text><text x="817" y="220" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">one pipeline behind all three</text></g><g><rect x="1090" y="158" width="280" height="86" rx="11" fill="#0a1020"/><rect x="1090" y="158" width="280" height="86" rx="11" fill="rgba(251, 146, 60, 0.25)" stroke="#fb923c" stroke-width="1.6"/><rect x="1090" y="158" width="280" height="86" rx="11" fill="url(#shade)"/><g transform="translate(1116,185)" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="-7" y="-7" width="14" height="12" rx="3"/><path d="M-3,1 h6 M-3,-3 h4"/><path d="M0,-7 v-3"/></g><text x="1137" y="189" font-size="12" fill="#fed7aa" text-anchor="start" font-weight="700" letter-spacing="0">Answer</text><text x="1137" y="207" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">LLM constrained to context</text><text x="1137" y="220" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">[n] citation per claim</text></g><g><rect x="770" y="300" width="260" height="86" rx="11" fill="#0a1020"/><rect x="770" y="300" width="260" height="86" rx="11" fill="rgba(6, 78, 59, 0.65)" stroke="#34d399" stroke-width="1.6"/><rect x="770" y="300" width="260" height="86" rx="11" fill="url(#shade)"/><g transform="translate(796,327)" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="-1" cy="-2" r="6"/><path d="M3,2 L8,7"/></g><text x="817" y="331" font-size="12" fill="#a7f3d0" text-anchor="start" font-weight="700" letter-spacing="0">Retrievers</text><text x="817" y="349" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">BM25 ∥ dense, top-k each</text><text x="817" y="362" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">best window per document</text></g><g><rect x="1090" y="300" width="280" height="86" rx="11" fill="#0a1020"/><rect x="1090" y="300" width="280" height="86" rx="11" fill="rgba(6, 78, 59, 0.65)" stroke="#34d399" stroke-width="1.6"/><rect x="1090" y="300" width="280" height="86" rx="11" fill="url(#shade)"/><g transform="translate(1116,327)" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,4 h5 l3,-8 h3 l3,8 h2"/></g><text x="1137" y="331" font-size="12" fill="#a7f3d0" text-anchor="start" font-weight="700" letter-spacing="0">Fusion + query</text><text x="1137" y="349" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">normalise → RRF k=60</text><text x="1137" y="362" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">optional per-retriever weights</text><rect x="1287.8" y="309" width="72.19999999999999" height="16" rx="8" fill="rgba(2,6,23,0.85)" stroke="#34d399" stroke-width="1"/><text x="1323.9" y="320.5" font-size="8" fill="#34d399" text-anchor="middle" font-weight="400" letter-spacing="0">75% sat@5</text></g><g><rect x="770" y="396" width="260" height="78" rx="11" fill="#0a1020"/><rect x="770" y="396" width="260" height="78" rx="11" fill="rgba(120, 53, 15, 0.4)" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="6,4"/><rect x="770" y="396" width="260" height="78" rx="11" fill="url(#shade)"/><g transform="translate(796,423)" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="-7" y="-7" width="14" height="12" rx="3"/><path d="M-3,1 h6 M-3,-3 h4"/><path d="M0,-7 v-3"/></g><text x="817" y="427" font-size="12" fill="#fde68a" text-anchor="start" font-weight="700" letter-spacing="0">HyDE</text><text x="817" y="445" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">hypothetical doc → dense</text><text x="817" y="458" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">off by default</text></g><g><rect x="40" y="506" width="1360" height="186" rx="18" fill="rgba(15,23,42,0.5)" stroke="#be123c" stroke-width="1.2" stroke-dasharray="9,6"/><path d="M 58 507 H 1382 a17,17 0 0 1 17,17 v16 h-1360 v-16 a17,17 0 0 1 17,-17 z" fill="#be123c" fill-opacity="0.13"/><text x="60" y="530" font-size="10.5" fill="#cbd5e1" text-anchor="start" font-weight="700" letter-spacing="1.3">MEASUREMENT</text><text x="1382" y="530" font-size="9" fill="#64748b" text-anchor="end" font-weight="400" letter-spacing="0">nothing ships until it is scored</text></g><g><rect x="70" y="560" width="310" height="100" rx="11" fill="#0a1020"/><rect x="70" y="560" width="310" height="100" rx="11" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.6"/><rect x="70" y="560" width="310" height="100" rx="11" fill="url(#shade)"/><g transform="translate(96,587)" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-5,-7 h10 M-3,-7 v5 l-4,8 h14 l-4,-8 v-5"/></g><text x="117" y="591" font-size="12" fill="#fecdd3" text-anchor="start" font-weight="700" letter-spacing="0">Benchmarks</text><text x="117" y="609" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">run_eval · run_intent</text><text x="117" y="622" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">run_hyde_intent · bench_ann</text><text x="117" y="635" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">run_rerank</text></g><g><rect x="400" y="560" width="310" height="100" rx="11" fill="#0a1020"/><rect x="400" y="560" width="310" height="100" rx="11" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.6"/><rect x="400" y="560" width="310" height="100" rx="11" fill="url(#shade)"/><g transform="translate(426,587)" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="-7" y="-6" width="14" height="12" rx="2"/><path d="M-3,0 h6"/></g><text x="447" y="591" font-size="12" fill="#fecdd3" text-anchor="start" font-weight="700" letter-spacing="0">Test suite</text><text x="447" y="609" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">pytest on 3.9 and 3.12</text><text x="447" y="622" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">80 passed · 21 subtests</text><text x="447" y="635" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">0 skipped with extras</text></g><g><rect x="730" y="560" width="310" height="100" rx="11" fill="#0a1020"/><rect x="730" y="560" width="310" height="100" rx="11" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.6"/><rect x="730" y="560" width="310" height="100" rx="11" fill="url(#shade)"/><g transform="translate(756,587)" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,4 a5,5 0 0 1 1,-10 a6,6 0 0 1 11,1 a4,4 0 0 1 0,9 z"/></g><text x="777" y="591" font-size="12" fill="#fecdd3" text-anchor="start" font-weight="700" letter-spacing="0">CI</text><text x="777" y="609" font-size="9" fill="#8fa3bb" text-anchor="start" font-weight="400" letter-spacing="0">GitHu