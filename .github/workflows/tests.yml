name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Fail fast: a break on the oldest supported interpreter is the interesting
      # signal, there is no point burning the 3.12 runner on it too.
      fail-fast: true
      matrix:
        # 3.9 is not in the ubuntu-24.04 image manifest, so the oldest supported
        # interpreter gets the oldest runner rather than silently dropping it.
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Editable install from a clean checkout of the catalogue entry: no extras
      # that pull numpy or onnxruntime, because the core must stay stdlib only.
      - name: Install the package (editable, dev tools only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Fixture retrieval eval (hit@1 / hit@3 / MRR)
        run: python eval/run_eval.py --corpus fixtures/corpus.json --questions fixtures/questions.json

      - name: Fixture intent eval (satisfied@k)
        run: python eval/run_intent.py --corpus fixtures/corpus.json --questions fixtures/questions_intent.json

  package:
    name: installs from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Build the wheel, then import it from outside the checkout. If metadata is
      # broken or a module is missing from the package list, this step dies.
      - name: Build a wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir wheelhouse .

      - name: Install the wheel into a throwaway venv
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/clean/bin/python" -m pip install wheelhouse/*.whl

      - name: Import the installed package from outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/clean/bin/python" -c "import rag, rag.ann, rag.chunking, rag.cli, rag.core, rag.embed, rag.fusion, rag.hyde, rag.llm, rag.rerank, rag.stem_es; print(rag.__file__)"

      - name: Console script answers from a fixture corpus
        run: |
          "$RUNNER_TEMP/clean/bin/rag" "junior data analyst" --corpus fixtures/corpus.json -k 2

  optional-extras:
    name: optional extras and models
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The three ONNX models the optional paths need. Cached, because they are
      # ~200 MB together and a cache hit is the difference between 20s and 2min.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/models
          key: rag-models-v1

      - name: Fetch models
        env:
          M: ${{ github.workspace }}/models
        run: |
          set -eu
          fetch() { mkdir -p "$(dirname "$2")"; [ -s "$2" ] || curl -sSL --fail -o "$2" "$1"; }
          fetch https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx \
                "$M/all-MiniLM-L6-v2/model.onnx"
          fetch https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json \
                "$M/all-MiniLM-L6-v2/tokenizer.json"
          fetch https://huggingface.co/cross-encoder/ms-marco-MiniLM-L6-v2/resolve/main/onnx/model.onnx \
                "$M/cross-encoder-ms-marco-minilm-l6-v2/onnx/model.onnx"
          fetch https://huggingface.co/cross-encoder/ms-marco-MiniLM-L6-v2/resolve/main/tokenizer.json \
                "$M/cross-encoder-ms-marco-minilm-l6-v2/tokenizer.json"
          fetch https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/onnx/model_quantized.onnx \
                "$M/paraphrase-multilingual-MiniLM-L12-v2/model_quantized.onnx"
          fetch https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/tokenizer.json \
                "$M/paraphrase-multilingual-MiniLM-L12-v2/tokenizer.json"
          du -sh "$M"/*

      - name: Install every extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ann,rerank,embeddings,api,ui]"

      - name: Tests, with no skip allowed
        env:
          MINILM_DIR: ${{ github.workspace }}/models/all-MiniLM-L6-v2
          RERANK_DIR: ${{ github.workspace }}/models/cross-encoder-ms-marco-minilm-l6-v2
          MULTI_DIR: ${{ github.workspace }}/models/paraphrase-multilingual-MiniLM-L12-v2
        run: |
          set +e
          python -m pytest -q -rs > pytest.log 2>&1
          rc=$?
          cat pytest.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::pytest failed with the extras installed"
            exit 1
          fi
          # The one legitimate skip needs private data no CI checkout can have.
          unexpected=$(grep "^SKIPPED" pytest.log | grep -v "private tracker/warehouse not present" || true)
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            echo "::error::an optional-dependency test was skipped with the extras installed"
            exit 1
          fi

      - name: Every embedder and the reranker, on the fixture corpus
        env:
          MULTI_DIR: ${{ github.workspace }}/models/paraphrase-multilingual-MiniLM-L12-v2
          MINILM_DIR: ${{ github.workspace }}/models/all-MiniLM-L6-v2
          RERANK_DIR: ${{ github.workspace }}/models/cross-encoder-ms-marco-minilm-l6-v2
        run: |
          for e in hash minilm multi; do
            echo "== embedder: $e"
            python eval/run_eval.py --embedder "$e" --corpus fixtures/corpus.json --questions fixtures/questions.json | head -8
          done
          echo "== hnsw"
          python eval/bench_ann.py --corpus fixtures/corpus.json --questions fixtures/questions.json --repeats 3 | head -14
          echo "== rerank, cross-encoder"
          python eval/run_rerank.py --corpus fixtures/corpus.json --questions fixtures/questions_intent.json --rerank cross --pools 10 | head -14

      - name: Streamlit page imports without a server
        run: python -c "import streamlit_app; print(streamlit_app.labels('en')['query'])"

      - name: API answers over HTTP
        env:
          RAG_CORPUS: ${{ github.workspace }}/fixtures/corpus.json
        run: |
          python -m uvicorn api:app --port 8100 --log-level warning &
          for i in $(seq 1 30); do
            curl -sf localhost:8100/openapi.json > /dev/null && break || sleep 1
          done
          curl -sf localhost:8100/search -H 'content-type: application/json' \
               -d '{"q":"junior data analyst","k":3}' | head -c 300; echo
