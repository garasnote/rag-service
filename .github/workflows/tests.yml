name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Unit tests
        run: python -m pytest -q
      - name: Fixture eval (no private data, no API key)
        run: python3 eval/run_eval.py --corpus fixtures/corpus.json --questions fixtures/questions.json
      - name: Fixture intent eval
        run: python3 eval/run_intent.py --corpus fixtures/corpus.json --questions fixtures/questions_intent.json
